<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030611">
  <title>For You — A Tulip Garden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="garden">
    <div class="sky" id="sky"></div>
    <div class="nebula"></div>
    <div class="moon-haze"></div>
    <div class="heart-field" id="heartField"></div>
    <div class="sparkles" id="sparkles"></div>
    <div class="heart-burst-layer" id="heartBurstLayer"></div>
    <button class="music-toggle" id="musicToggle" type="button" aria-label="Turn ambient music on" aria-pressed="false">
      <span class="music-icon">♫</span><span class="music-label">MUSIC OFF</span>
    </button>
    <div class="hint" id="hint">tap a floating heart ✦</div>

    <div class="distant-hill hill-one"></div>
    <div class="distant-hill hill-two"></div>

    <section class="meadow" aria-label="A garden of tulips">
      <div class="grass-layer grass-back" id="grassBack"></div>
      <div class="foliage">
        <i class="leaf leaf-a"></i><i class="leaf leaf-b"></i>
        <i class="leaf leaf-c"></i><i class="leaf leaf-d"></i>
        <i class="leaf leaf-e"></i><i class="leaf leaf-f"></i>
        <i class="leaf leaf-g"></i><i class="leaf leaf-h"></i>
        <i class="leaf leaf-i"></i><i class="leaf leaf-j"></i>
      </div>

      <div class="tulip tulip-a blush" style="--x:25%;--h:205px;--delay:1.2s;--lean:-5deg">
        <div class="stem"><i class="stem-leaf one"></i><i class="stem-leaf two"></i></div>
        <div class="flower-head">
          <i class="petal rear left"></i><i class="petal rear right"></i>
          <i class="petal middle"></i><i class="petal front left"></i><i class="petal front right"></i>
          <i class="cup-shadow"></i>
        </div>
      </div>

      <div class="tulip tulip-b ruby" style="--x:50%;--h:285px;--delay:.25s;--lean:3deg">
        <div class="stem"><i class="stem-leaf one"></i><i class="stem-leaf two"></i></div>
        <div class="flower-head">
          <i class="petal rear left"></i><i class="petal rear right"></i>
          <i class="petal middle"></i><i class="petal front left"></i><i class="petal front right"></i>
          <i class="cup-shadow"></i>
        </div>
      </div>

      <div class="tulip tulip-c coral" style="--x:75%;--h:225px;--delay:1.65s;--lean:5deg">
        <div class="stem"><i class="stem-leaf one"></i><i class="stem-leaf two"></i></div>
        <div class="flower-head">
          <i class="petal rear left"></i><i class="petal rear right"></i>
          <i class="petal middle"></i><i class="petal front left"></i><i class="petal front right"></i>
          <i class="cup-shadow"></i>
        </div>
      </div>

      <div class="tulip tulip-d lavender" style="--x:9%;--h:150px;--delay:2.1s;--lean:-7deg">
        <div class="stem"><i class="stem-leaf one"></i><i class="stem-leaf two"></i></div>
        <div class="flower-head">
          <i class="petal rear left"></i><i class="petal rear right"></i>
          <i class="petal middle"></i><i class="petal front left"></i><i class="petal front right"></i>
          <i class="cup-shadow"></i>
        </div>
      </div>

      <div class="grass-layer grass-front" id="grassFront"></div>
      <div class="ground-light"></div>
    </section>
    <div class="vignette"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
